<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理面板 - 权限管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: white;
            border-radius: 10px;
            padding: 20px 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header h1 {
            color: #333;
            font-size: 24px;
        }
        .header p {
            color: #666;
            margin-top: 5px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .stat-card .number {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
        }
        .stat-card .label {
            color: #666;
            margin-top: 5px;
        }
        .panel {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .panel-header h2 {
            color: #333;
            font-size: 18px;
        }
        .search-box {
            display: flex;
            gap: 10px;
        }
        .search-box input {
            padding: 8px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            width: 200px;
        }
        .search-box button {
            padding: 8px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .search-box button:hover {
            background: #5a6fd6;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #f8f9fa;
            color: #333;
            font-weight: 600;
        }
        tr:hover {
            background: #f8f9fa;
        }
        .role-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .role-admin {
            background: #e3f2fd;
            color: #1976d2;
        }
        .role-teacher {
            background: #e8f5e9;
            color: #388e3c;
        }
        .role-reviewer {
            background: #fff3e0;
            color: #f57c00;
        }
        .role-select {
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn {
            padding: 6px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            margin-right: 5px;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-success {
            background: #4caf50;
            color: white;
        }
        .btn-danger {
            background: #f44336;
            color: white;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 10px;
            padding: 30px;
            width: 400px;
            max-width: 90%;
        }
        .modal-header {
            margin-bottom: 20px;
        }
        .modal-header h3 {
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 5px;
            color: white;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
        }
        .toast.success {
            background: #4caf50;
        }
        .toast.error {
            background: #f44336;
        }
        .toast.show {
            opacity: 1;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>后台管理面板</h1>
            <p>管理用户权限 - 管理员 / 教师 / 评审专家</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="number" id="totalUsers">0</div>
                <div class="label">总用户数</div>
            </div>
            <div class="stat-card">
                <div class="number" id="adminCount">0</div>
                <div class="label">管理员</div>
            </div>
            <div class="stat-card">
                <div class="number" id="teacherCount">0</div>
                <div class="label">教师</div>
            </div>
            <div class="stat-card">
                <div class="number" id="reviewerCount">0</div>
                <div class="label">评审专家</div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <h2>用户列表</h2>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索用户名或姓名...">
                    <button onclick="searchUsers()">搜索</button>
                    <button class="btn btn-success" onclick="openAddModal()">添加用户</button>
                </div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>账号</th>
                        <th>姓名</th>
                        <th>角色</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr>
                        <td colspan="5" class="loading">加载中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>修改用户权限</h3>
            </div>
            <div class="form-group">
                <label>账号</label>
                <input type="text" id="editUsername" readonly>
            </div>
            <div class="form-group">
                <label>姓名</label>
                <input type="text" id="editName">
            </div>
            <div class="form-group">
                <label>角色</label>
                <select id="editRole">
                    <option value="admin">管理员</option>
                    <option value="teacher">教师</option>
                    <option value="reviewer">评审专家</option>
                </select>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeEditModal()">取消</button>
                <button class="btn btn-primary" onclick="saveUser()">保存</button>
            </div>
        </div>
    </div>

    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>添加用户</h3>
            </div>
            <div class="form-group">
                <label>账号</label>
                <input type="text" id="addUsername">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="addPassword">
            </div>
            <div class="form-group">
                <label>姓名</label>
                <input type="text" id="addName">
            </div>
            <div class="form-group">
                <label>角色</label>
                <select id="addRole">
                    <option value="admin">管理员</option>
                    <option value="teacher">教师</option>
                    <option value="reviewer">评审专家</option>
                </select>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeAddModal()">取消</button>
                <button class="btn btn-success" onclick="addUser()">添加</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_BASE = 'http://localhost:8080';
        let currentEditId = null;
        let allUsers = [];

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => {
                toast.className = 'toast';
            }, 3000);
        }

        function getRoleText(role) {
            const roles = {
                'admin': '管理员',
                'teacher': '教师',
                'reviewer': '评审专家'
            };
            return roles[role] || role;
        }

        function getRoleBadgeClass(role) {
            return 'role-' + role;
        }

        async function loadUsers() {
            try {
                const response = await fetch(API_BASE + '/admin/user');
                const data = await response.json();
                if (data.code === 1) {
                    allUsers = data.data || [];
                    renderUsers(allUsers);
                    updateStats(allUsers);
                } else {
                    showToast('加载用户列表失败', 'error');
                }
            } catch (error) {
                showToast('网络错误', 'error');
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('userTableBody');
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#999;">暂无数据</td></tr>';
                return;
            }
            tbody.innerHTML = users.map(user => `
                <tr>
                    <td>${user.id}</td>
                    <td>${user.username}</td>
                    <td>${user.name}</td>
                    <td>
                        <span class="role-badge ${getRoleBadgeClass(user.role)}">${getRoleText(user.role)}</span>
                    </td>
                    <td>
                        <button class="btn btn-primary" onclick="openEditModal(${user.id}, '${user.username}', '${user.name}', '${user.role}')">编辑</button>
                        <button class="btn btn-danger" onclick="deleteUser(${user.id})">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        function updateStats(users) {
            document.getElementById('totalUsers').textContent = users.length;
            document.getElementById('adminCount').textContent = users.filter(u => u.role === 'admin').length;
            document.getElementById('teacherCount').textContent = users.filter(u => u.role === 'teacher').length;
            document.getElementById('reviewerCount').textContent = users.filter(u => u.role === 'reviewer').length;
        }

        function searchUsers() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allUsers.filter(u => 
                u.username.toLowerCase().includes(keyword) || 
                u.name.toLowerCase().includes(keyword)
            );
            renderUsers(filtered);
        }

        function openEditModal(id, username, name, role) {
            currentEditId = id;
            document.getElementById('editUsername').value = username;
            document.getElementById('editName').value = name;
            document.getElementById('editRole').value = role;
            document.getElementById('editModal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            currentEditId = null;
        }

        function openAddModal() {
            document.getElementById('addUsername').value = '';
            document.getElementById('addPassword').value = '';
            document.getElementById('addName').value = '';
            document.getElementById('addRole').value = 'teacher';
            document.getElementById('addModal').classList.add('active');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('active');
        }

        async function saveUser() {
            const name = document.getElementById('editName').value;
            const role = document.getElementById('editRole').value;

            try {
                const response = await fetch(API_BASE + '/admin/user', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id: currentEditId,
                        name: name,
                        role: role
                    })
                });
                const data = await response.json();
                if (data.code === 1) {
                    showToast('保存成功', 'success');
                    closeEditModal();
                    loadUsers();
                } else {
                    showToast(data.msg || '保存失败', 'error');
                }
            } catch (error) {
                showToast('网络错误', 'error');
            }
        }

        async function addUser() {
            const username = document.getElementById('addUsername').value;
            const password = document.getElementById('addPassword').value;
            const name = document.getElementById('addName').value;
            const role = document.getElementById('addRole').value;

            if (!username || !password || !name) {
                showToast('请填写完整信息', 'error');
                return;
            }

            try {
                const response = await fetch(API_BASE + '/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        name: name,
                        role: role
                    })
                });
                const data = await response.json();
                if (data.code === 1) {
                    showToast('添加成功', 'success');
                    closeAddModal();
                    loadUsers();
                } else {
                    showToast(data.msg || '添加失败', 'error');
                }
            } catch (error) {
                showToast('网络错误', 'error');
            }
        }

        async function deleteUser(id) {
            if (!confirm('确定要删除该用户吗？')) return;

            try {
                const response = await fetch(API_BASE + '/admin/user/' + id, {
                    method: 'DELETE'
                });
                const data = await response.json();
                if (data.code === 1) {
                    showToast('删除成功', 'success');
                    loadUsers();
                } else {
                    showToast(data.msg || '删除失败', 'error');
                }
            } catch (error) {
                showToast('网络错误', 'error');
            }
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchUsers();
        });

        loadUsers();
    </script>
</body>
</html>
